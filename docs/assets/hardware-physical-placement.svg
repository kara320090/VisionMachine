<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">VisionMachine 실제 설치 배치도</title>
  <desc id="desc">하이박스, 토양수분 센서, 외기 온습도 센서, 광학과 표면온도 센서를 화분과 잎 주변에 배치하는 방법</desc>
  <defs>
    <style>
      text { font-family:"Noto Sans KR","Malgun Gothic",sans-serif; fill:#152238 }
      .title { font-size:38px; font-weight:800 }.sub{font-size:19px;fill:#526076}.head{font-size:24px;font-weight:800}.body{font-size:17px}.small{font-size:14px;fill:#526076}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.wire{stroke:#64748b;stroke-width:5;fill:none}.aim{stroke:#7c3aed;stroke-width:4;stroke-dasharray:10 8;fill:none}.usb{stroke:#2563eb;stroke-width:7;fill:none}
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f6f8fc"/>
  <text x="65" y="65" class="title">3. 실제 화분 주변 배치</text>
  <text x="65" y="101" class="sub">제어보드는 하이박스 안 · 측정 센서는 목적에 맞게 밖에 고정 · 광학과 표면온도는 같은 표적을 겨냥</text>

  <rect x="70" y="235" width="285" height="440" rx="34" fill="#172033"/>
  <rect x="92" y="285" width="241" height="310" rx="12" fill="#e8f1ff"/>
  <text x="212" y="355" text-anchor="middle" class="head">Android 앱</text>
  <text x="212" y="402" text-anchor="middle" class="body">촬영</text><text x="212" y="438" text-anchor="middle" class="body">USB 실측 수신</text><text x="212" y="474" text-anchor="middle" class="body">서버 전송</text>
  <text x="212" y="710" text-anchor="middle" class="small">USB-C 데이터 케이블</text>

  <rect x="440" y="270" width="370" height="315" rx="28" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <rect x="490" y="340" width="270" height="165" rx="18" fill="#dff7f1" stroke="#0f766e" stroke-width="3"/>
  <rect x="530" y="310" width="190" height="85" rx="14" fill="#fff7d6" stroke="#ca8a04" stroke-width="3"/>
  <text x="625" y="365" text-anchor="middle" class="head">DFR0265</text>
  <text x="625" y="450" text-anchor="middle" class="head">UNO R4</text>
  <rect x="685" y="455" width="90" height="75" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="730" y="485" text-anchor="middle" class="small">DFR0759</text><text x="730" y="510" text-anchor="middle" class="small">HUB</text>
  <text x="625" y="625" text-anchor="middle" class="head">하이박스 내부</text>
  <text x="625" y="660" text-anchor="middle" class="small">절연 지지대 고정 · 케이블 당김 방지</text>
  <path d="M355 560 C390 560 410 470 440 470" class="usb"/>

  <path d="M1010 575 L1400 575 L1365 915 L1045 915 Z" fill="#b77944" stroke="#7c4a25" stroke-width="4"/>
  <rect x="1000" y="545" width="410" height="58" rx="15" fill="#8b5e3c"/>
  <path d="M1065 600 Q1200 530 1340 600 L1330 880 L1080 880 Z" fill="#5d4037" opacity=".78"/>
  <path d="M1210 595 C1190 455 1230 335 1320 260" stroke="#2f855a" stroke-width="16" fill="none"/>
  <path d="M1290 280 C1400 190 1490 265 1365 330 C1315 355 1260 330 1290 280Z" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
  <path d="M1195 420 C1080 345 1040 430 1145 470 C1180 482 1210 462 1195 420Z" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
  <text x="1200" y="960" text-anchor="middle" class="head">시험 화분</text>

  <rect x="1110" y="625" width="34" height="230" rx="12" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <rect x="1098" y="600" width="58" height="55" rx="10" fill="#334155"/>
  <text x="920" y="780" class="head">SEN0308</text>
  <text x="870" y="813" class="small">프로브만 흙 속</text>
  <text x="860" y="839" class="small">전자부·커넥터는 밖</text>
  <path d="M810 500 C930 500 980 650 1100 650" class="wire"/>

  <rect x="850" y="180" width="210" height="115" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="875" y="225" class="head">SEN0334</text><text x="875" y="260" class="small">외기에 노출 · 통풍 확보</text>
  <path d="M775 485 C830 450 850 340 930 295" class="wire"/>

  <rect x="900" y="330" width="235" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="925" y="375" class="head">SEN0364</text><text x="925" y="411" class="small">거리·각도·조명 고정</text>
  <path d="M775 500 C830 490 850 450 920 430" class="wire"/>
  <path d="M1135 385 C1220 355 1260 310 1320 292" class="aim" marker-end="url(#arr)"/>

  <rect x="1230" y="390" width="245" height="120" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="1255" y="435" class="head">SEN0206</text><text x="1255" y="471" class="small">35° 시야 · 비접촉 측정</text>
  <path d="M775 520 C980 540 1130 490 1230 455" class="wire"/>
  <path d="M1350 390 C1365 350 1360 325 1350 310" class="aim" marker-end="url(#arr)"/>

  <rect x="70" y="800" width="790" height="135" rx="20" class="card"/>
  <text x="100" y="843" class="head">반복 측정 때 반드시 고정할 조건</text>
  <text x="100" y="882" class="body">① 식물 ID·잎/과실 위치  ② 센서 거리·각도  ③ 광학 게인·적분시간·조명  ④ 측정 시각</text>
  <text x="100" y="913" class="small">하이박스를 닫기 전에 실제 부품 위치와 케이블 굽힘을 확인한 뒤 구멍을 가공한다.</text>
</svg>
