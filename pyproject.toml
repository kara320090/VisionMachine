[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "visionmachine-foundation"
version = "0.1.0"
description = "VisionMachine development foundation, not a diagnostic product"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["server/src", "packages/contracts/src", "data-pipeline/src", "ml/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
